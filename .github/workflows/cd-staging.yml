name: Continuous Delivery - Staging Deployment
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  packages: read
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: echo IMAGE=ghcr.io/${{ github.repository }}:sha-${{ github.sha }} >> $GITHUB_ENV
      - name: Deploy to staging
        run: echo Configure deployment
      - name: Health check
        run: echo Health check against ${{ vars.STAGING_URL }}/health
