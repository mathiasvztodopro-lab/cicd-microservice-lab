name: Continuous Delivery - Deploy to Staging
on:
  workflow_run:
    workflows: ["Docker Image Packaging & Publish to GHCR"]
    types: [ completed ]
    branches: [ main ]
permissions:
  contents: read
  deployments: write
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    if: github.event.workflow_run.conclusion == "success"
    steps:
      - uses: actions/checkout@v4
      - name: Announce Deployment Start
        run: |
          echo "Iniciando Despliegue Continuo a STAGING"
          echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"
      - name: Trigger Cloud Platform Deployment
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}")
            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
              echo "OK HTTP $RESPONSE"
            else
              echo "FAIL HTTP $RESPONSE"; exit 1
            fi
          else
            echo "Sin webhook - simulacion OK"
          fi
      - name: Await Container Boot
        run: sleep 30
      - name: Smoke Tests (post-deploy)
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: bash I-CAPACITACION/api-service/scripts/smoke-test.sh
      - name: Health check
        run: |
          if [ -n "${{ vars.STAGING_URL }}" ]; then
            curl -f "${{ vars.STAGING_URL }}/health" || exit 1
          fi
  rollback:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: failure() && github.ref == "refs/heads/main"
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Rollback automatizado
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: bash I-CAPACITACION/api-service/scripts/rollback.sh
