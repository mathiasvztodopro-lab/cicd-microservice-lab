name: Security Scan - DevSecOps
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: I-CAPACITACION/api-service/package-lock.json
      - run: npm ci
        working-directory: I-CAPACITACION/api-service
      - run: npm audit --audit-level=high || true
        working-directory: I-CAPACITACION/api-service
  trivy-scan:
    runs-on: ubuntu-latest
    needs: dependency-audit
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-service:scan ./I-CAPACITACION/api-service
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-service:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
